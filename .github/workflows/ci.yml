name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # 双击离线版不入库，用仓库内的 site/ 数据现生成，供 file-test 检查
      - run: node build/build-standalone.js
      - run: npm run check:pages
      - run: npm run test:unit
      - run: npm run test:http
      - run: npm run test:file
      # e2e 依赖 jsdom，本机一直未能运行；先在 CI 观察结果，不阻塞部署
      - run: npm run test:e2e
        continue-on-error: true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 部署 site/ 到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: '自动部署 ${{ github.sha }}'
